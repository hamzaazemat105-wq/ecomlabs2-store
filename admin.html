<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>
<style>
body { background: #0f0f14; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
.box { background: #1a1a22; border: 1px solid #333; border-radius: 12px; padding: 20px; max-width: 400px; margin: 20px auto; }
input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
button { width: 100%; padding: 14px; background: #ff2d2d; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }
h1 { text-align: center; color: #ff2d2d; }
p { text-align: center; color: #888; }
</style>
</head>
<body>
<h1>🛡️ لوحة الإدارة</h1>
<p>نسخة اختبار — إذا شفتي هاد النموذج، الصفحة خدامة</p>
<div class="box">
<input type="email" id="e" placeholder="البريد الإلكتروني" value="hamzaazemat105@gmail.com">
<input type="password" id="p" placeholder="كلمة المرور">
<button onclick="alert('الزر خدام! جاري تحميل النظام الكامل...')">دخول</button>
</div>
<p id="msg"></p>
<script>
document.getElementById('msg').textContent = 'JavaScript خدام ✅';
</script>
</body>
</html>
